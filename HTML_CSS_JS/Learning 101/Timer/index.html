<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Tells the browser which character set to use -->
    <meta charset="UTF-8">
    <!-- Makes the page responsive on mobile devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Shows the title in the browser tab -->
    <title>JavaScript Countdown Timer</title>
    <!-- Links the page to the CSS file for styling -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Main card that holds the timer -->
    <div class="timer-card">
        <!-- Timer heading -->
        <h2>Countdown Timer</h2>
        <!-- This element displays the current time remaining -->
        <div id="display">04:00:00</div>

        <!-- Buttons used to control the timer -->
        <div class="controls">
            <button id="startBtn">Start</button>
            <button id="pauseBtn">Pause</button>
            <button id="resetBtn">Reset</button>
        </div>
    </div>

    <!-- Loads the JavaScript logic for the timer -->
    <script src="script.js"></script>
</body>
</html>
