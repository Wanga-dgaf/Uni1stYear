<!DOCTYPE html>
<html>
<head>
    <title>VAT Calculator</title>
    <link rel = "stylesheet" href = "style.css">
</head>

<body>



<div class="calculator">

<table width = 400px>
    <tr id = "tHeader">
      <td colspan="2">
        <p id = "tHeader-font-size"><b> VAT Calculator </b></p>
      </td>
    </tr>
    <tr>
      <td>Enter item price</td>
        <td>
          <input type="text" id="price">
        </td>
     </tr>
    <tr>
      <td>VAT Status</td>
      <td>
      <select id="vatStatus">
        <option value="15">South Africa (15% VAT)</option>
        <option value="17">Outside South Africa (17% VAT)</option>
      </select>
      </td>
      </tr>
      <tr>
       <td>Total including VAT</td>
      <td>
        <input type="text" id="total" readonly>
        </td>
         </tr>
         <tr>
         <td></td>
         <td>
         <button onclick="calculateVAT()">Calculate</button>
         </td>
         </tr>
        </table>
    </div>

<script src="scriptJ.js"></script>

</body>
</html>
